<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
    <h1>
        Race Registration!!
    </h1>
    <p>
        
            <label for="name">Enter your username</label>
            <input type="text" name=" First name" id="name" required>
    </p>
    <p>
        <label for="Last">Enter your Last name</label>
        <input type="text" id="Last" name="Last Name" required>
    </p>
    <p>
        <label for="race">Select Your Race</label>
        <select name="Race" id="race" required>
            <option value="">Please select an option</option>
            <option value="Long">10KM</option>
            <option value="Medium">5KM</option>
            <option value="Short">3KM</option>
        </select>
    </p>
    <p>
        <label for="mail">Enter email</label>
        <input type="email" id="mail" name="Email" required>
    </p>
    <p>
        <label for="pass">Enter password</label>
        <input type="password" id="pass" name="Password" required>
    </p>
    <p>
        <label for="ys">Wanna participate</label>
        <input type="radio" name="YN" id="ys" value="ys">
        <label for="nn">Just yapping</label>
        <input type="radio" name="yap" id="nn" value="nn">
    </p>
    <p>
        <button>Register</button>
    </p>
</body>
</html>
